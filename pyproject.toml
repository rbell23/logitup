[project]
name = "logitup"
version = "0.1.0"
description = "Small, reusable defaults for Python stdlib logging"
readme = "README.md"
authors = [
    { name = "Robert Bell", email = "robert@rbell.me" }
]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
